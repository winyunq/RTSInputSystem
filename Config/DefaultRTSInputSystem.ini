+CommandLoadouts=(LoadoutId="Builder",bIncludeDefaultUnitCommands=true,CommandSlots=((SlotIndex=10,CommandTagName="RTS.Command.Menu.Build.Defense",SubMenuLoadoutId="BuilderDefense",DisplayName="建造建筑",Description="打开防御建筑列表。选择具体建筑后，由目标附近最近的可用步兵前往施工，军官留在原地。",Hotkey="Z"),(SlotIndex=11,CommandTagName="RTS.Command.Menu.Build.Production",SubMenuLoadoutId="BuilderProduction",DisplayName="建造产能",Description="打开产能建筑列表。系统优先指派目标附近最近的空闲同队军官施工；按住Shift可并行分派。",Hotkey="X")))
+CommandLoadouts=(LoadoutId="BuilderDefense",bIncludeDefaultUnitCommands=false,CommandSlots=((SlotIndex=0,CommandTagName="RTS.Command.Build.FieldCover",DisplayName="沙袋堑壕",Description="第一排碉堡：修建六边形三层沙袋工事，同时代表堑壕、掩体与碉堡。优先由附近同队步兵施工；附近没有步兵时由军官亲自施工。",Hotkey="Q"),(SlotIndex=1,CommandTagName="RTS.Command.Build.MachineGunBunker",DisplayName="机枪碉堡",Description="在沙袋工事内部署一名机枪手；射手和机枪作为炮塔追踪目标。优先由附近同队步兵施工。",Hotkey="W"),(SlotIndex=2,CommandTagName="RTS.Command.Build.AntiTankBunker",DisplayName="反坦克碉堡",Description="在沙袋工事内部署两名炮手和一门57毫米反坦克炮；炮组整体作为炮塔追踪目标。优先由附近同队步兵施工。",Hotkey="E"),(SlotIndex=3,CommandTagName="RTS.Command.Build.AntiAircraftEmplacement",DisplayName="防空炮阵地",Description="修建双联机关炮防空阵地，以高仰角火力保护附近部队和建筑。优先由附近同队步兵施工。",Hotkey="R"),(SlotIndex=10,CommandTagName="RTS.Command.Build.AntiTankObstacle",DisplayName="反坦克陷阱",Description="第三排增益/减益工事：修建六边形反坦克障碍，使敌方坦克减速并削弱装甲。优先由附近同队步兵施工。",Hotkey="Z"),(SlotIndex=11,CommandTagName="RTS.Command.Build.BarbedWire",DisplayName="铁丝网",Description="第三排增益/减益工事：修建六边形铁丝网，使敌方步兵减速。优先由附近同队步兵施工。",Hotkey="X")),BackToLoadoutId="Builder",BackButtonSlotIndex=14,BackButtonDisplayName="返回军官命令",BackButtonDescription="返回军官主命令卡。",BackButtonHotkey="B")
+CommandLoadouts=(LoadoutId="BuilderProduction",bIncludeDefaultUnitCommands=false,CommandSlots=((SlotIndex=0,CommandTagName="RTS.Command.Build.Barracks",DisplayName="建造兵营",Description="指定网格后，系统指派最近的空闲同队军官，用14个游戏日完成兵营。按住Shift可追加并行施工地点。",Hotkey="Q"),(SlotIndex=1,CommandTagName="RTS.Command.Build.TankFactory",DisplayName="建造坦克工厂",Description="指定4×4格占地后，系统指派最近的空闲同队军官，用28个游戏日完成坦克工厂。按住Shift可追加并行施工地点。",Hotkey="W"),(SlotIndex=2,CommandTagName="RTS.Command.Build.VehicleFactory",DisplayName="建造战车工厂",Description="指定4×4格占地后，系统指派最近的空闲同队军官，用28个游戏日完成战车工厂。按住Shift可追加并行施工地点。",Hotkey="E")),BackToLoadoutId="Builder",BackButtonSlotIndex=14,BackButtonDisplayName="返回军官命令",BackButtonDescription="返回军官主命令卡。",BackButtonHotkey="B")
